[package]
name = "horizon-mod-music-player"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Music Player ported to Horizon (slice 1: config, settings, playlists, track queue state machine, track manager). Upstream: github.com/MC-U-Team/Music-Player, Apache-2.0 (c) 2024 U-Team."

[lib]
path = "src/lib.rs"

[dependencies]
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
fastrand = "2"

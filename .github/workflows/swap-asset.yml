name: swap-release-asset

on:
  push:
    branches: [main]
    paths: ['.github/workflows/swap-asset.yml']

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and verify upstream LICENSE
        run: |
          set -e
          curl -fsSL https://raw.githubusercontent.com/MC-U-Team/Music-Player/1120a0c/LICENSE -o LICENSE
          GOT=$(sha256sum LICENSE | cut -d' ' -f1)
          if [ "$GOT" != "69174d1a87f4b9570a9f019f9367f2bf125f8921776b94971546ec17bca9f547" ]; then
            echo "LICENSE sha mismatch: $GOT"
            exit 1
          fi

      - name: Package and verify the .hmod
        run: |
          set -e
          python3 - <<'PY'
          import zipfile
          members = ['Cargo.lock','Cargo.toml','LICENSE','README.md','horizon-mod.toml','assets/musicplayer/lang/en_us.json','src/lib.rs','runtime.rs']
          with zipfile.ZipFile('music_player-1.0.0.hmod','w') as z:
              for m in members:
                  zi = zipfile.ZipInfo(m, date_time=(2026,11,21,0,0,0))
                  zi.compress_type = zipfile.ZIP_DEFLATED
                  zi.external_attr = 0o644 << 16
                  z.writestr(zi, open(m,'rb').read())
          PY
          GOT=$(sha256sum music_player-1.0.0.hmod | cut -d' ' -f1)
          echo "package sha256: $GOT"
          if [ "$GOT" != "65871a5469ac2dc86aea3d81abe4f92f3ace8d8810062e348b7e1052f09be0c0" ]; then
            echo "package sha mismatch"
            exit 1
          fi

      - name: Replace release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release upload v1.0.0 music_player-1.0.0.hmod --clobber
          gh release delete-asset v1.0.0 music_player-1.0.0.hnmod --yes

      - name: Clean up and remove this workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/swap-asset.yml
          git add LICENSE
          git commit -m "Add Apache-2.0 LICENSE from upstream; remove temporary release-asset workflow"
          git push origin HEAD:main

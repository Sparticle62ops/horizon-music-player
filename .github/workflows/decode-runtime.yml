name: decode-runtime

on:
  push:
    branches: [main]
    paths: ['.github/workflows/decode-runtime.yml']

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode runtime.rs in place
        run: |
          set -e
          base64 -d runtime.rs > rt.dec
          GOT=$(sha256sum rt.dec | cut -d' ' -f1)
          echo "decoded sha256: $GOT"
          if [ "$GOT" != "0202771dc4f63c714f6f581a453c7a9248b09d3473946644bb75a39afb2f57c7" ]; then
            echo "sha mismatch, aborting"
            exit 1
          fi
          mv rt.dec runtime.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime.rs
          git commit -m "Fix runtime.rs: the copy on main was stored base64-encoded; decode in place (sha256 0202771d)"
          git push origin HEAD:main

      - name: Remove this temporary workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/decode-runtime.yml
          git commit -m "Remove temporary decode workflow"
          git push origin HEAD:main
